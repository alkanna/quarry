# On every push to master, release-please keeps a release PR up to date from Conventional Commits.
# Merging that PR tags vX.Y.Z, creates the GitHub release, and the build job attaches the apps.
# The file names below are what the in-app updater downloads (src/update.rs, asset_name).
name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: macos-universal }
          # Built on the oldest Ubuntu image: the binary needs that glibc or newer (2.35).
          - { os: ubuntu-22.04, name: linux-x86_64 }
          - { os: ubuntu-22.04-arm, name: linux-aarch64 }
          - { os: windows-2022, name: windows-x86_64 }
          - { os: windows-11-arm, name: windows-aarch64 }
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: macOS universal app
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          # Apple silicon, Intel, then both in one app; later runs reuse the compiled targets.
          for pair in "arm64:aarch64-apple-darwin" "x86_64:x86_64-apple-darwin" "universal:aarch64-apple-darwin x86_64-apple-darwin"; do
            TARGETS="${pair#*:}" ./bundle.sh
            ditto -c -k --keepParent dist/Quarry.app "Quarry-macos-${pair%%:*}.zip"
          done
          gh release upload "$TAG" Quarry-macos-arm64.zip Quarry-macos-x86_64.zip Quarry-macos-universal.zip --clobber

      - name: Linux binary
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          tar -czf quarry-${{ matrix.name }}.tar.gz -C target/release quarry
          gh release upload "$TAG" quarry-${{ matrix.name }}.tar.gz --clobber

      # ring needs clang for Windows on ARM; the runner image ships LLVM here.
      - name: Clang for Windows on ARM
        if: matrix.name == 'windows-aarch64'
        shell: bash
        run: echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"

      - name: Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked
          Compress-Archive -Path target/release/quarry.exe -DestinationPath quarry-${{ matrix.name }}.zip
          gh release upload "$env:TAG" quarry-${{ matrix.name }}.zip --clobber
