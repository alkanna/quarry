# On every push to master, release-please keeps a release PR up to date from Conventional Commits.
# Merging that PR tags vX.Y.Z, creates the GitHub release, and the build job attaches the apps.
# The file names below are what the in-app updater downloads (src/update.rs, asset_name).
name: Release

on:
  push:
    branches: [master]
  # Rebuilds and attaches the apps for an existing release, for when a build job failed.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, like v0.11.0
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The newest Apple silicon image, so a retired version never stops a release again.
          - { os: macos-latest, name: macos-universal }
          # Built on the oldest Ubuntu image: the binary needs that glibc or newer (2.35).
          - { os: ubuntu-22.04, name: linux-x86_64 }
          - { os: ubuntu-22.04-arm, name: linux-aarch64 }
          - { os: windows-latest, name: windows-x86_64 }
          - { os: windows-11-arm, name: windows-aarch64 }
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      # Skipped without the secrets, so the app falls back to an ad-hoc signature.
      - name: macOS signing keychain
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          [ -n "$MACOS_CERT_P12" ] || { echo "No signing secrets, using an ad-hoc signature"; exit 0; }
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          # Lets codesign use the key without a password prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "QUARRY_SIGN_ID=$(security find-identity -v -p codesigning "$KC" | awk 'NR==1{print $2}')" >> "$GITHUB_ENV"
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "QUARRY_NOTARY_ARGS=--key $RUNNER_TEMP/notary.p8 --key-id $APPLE_API_KEY_ID --issuer $APPLE_API_ISSUER" >> "$GITHUB_ENV"

      - name: macOS universal app
        if: runner.os == 'macOS'
        run: |
          # Apple silicon, Intel, then both in one app; later runs reuse the compiled targets.
          for arch in arm64 x86_64 universal; do
            ./bundle.sh "macos-$arch"
            ditto -c -k --keepParent dist/Quarry.app "Quarry-macos-$arch.zip"
          done
          for f in Quarry-macos-*.zip; do shasum -a 256 "$f" > "$f.sha256"; done
          gh release upload "$TAG" Quarry-macos-*.zip.sha256 --clobber
          gh release upload "$TAG" Quarry-macos-arm64.zip Quarry-macos-x86_64.zip Quarry-macos-universal.zip --clobber

      - name: Linux binary
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          tar -czf quarry-${{ matrix.name }}.tar.gz -C target/release quarry
          sha256sum quarry-${{ matrix.name }}.tar.gz > quarry-${{ matrix.name }}.tar.gz.sha256
          gh release upload "$TAG" quarry-${{ matrix.name }}.tar.gz.sha256 --clobber
          gh release upload "$TAG" quarry-${{ matrix.name }}.tar.gz --clobber

      # ring needs clang for Windows on ARM; the runner image ships LLVM here.
      - name: Clang for Windows on ARM
        if: matrix.name == 'windows-aarch64'
        shell: bash
        run: echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"

      - name: Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked
          Compress-Archive -Path target/release/quarry.exe -DestinationPath quarry-${{ matrix.name }}.zip
          $hash = (Get-FileHash -Algorithm SHA256 quarry-${{ matrix.name }}.zip).Hash.ToLower()
          "$hash  quarry-${{ matrix.name }}.zip" | Set-Content -NoNewline quarry-${{ matrix.name }}.zip.sha256
          gh release upload "$env:TAG" quarry-${{ matrix.name }}.zip.sha256 --clobber
          gh release upload "$env:TAG" quarry-${{ matrix.name }}.zip --clobber
