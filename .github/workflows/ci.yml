# Builds and tests every pull request on each system and architecture the release ships, so a
# release never breaks at tag time.
name: CI

# Runs only once a maintainer adds the "ci" label to the pull request, then on every push to it.
on:
  pull_request:
    types: [labeled, synchronize]

jobs:
  test:
    # Checks the label just added, so adding some other label to a "ci" pull request does not rerun it.
    if: github.event.label.name == 'ci' || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'ci'))
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    # No debug info: faster compiles and links, and smaller caches to restore and save.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      # ring needs clang for Windows on ARM; the runner image ships LLVM here.
      - name: Clang for Windows on ARM
        if: matrix.os == 'windows-11-arm'
        shell: bash
        run: echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
      # The tests are platform independent, so one system runs them; the others only need to
      # compile, and a check skips code generation and linking.
      # A real server for the tests that check writes never overwrite or lose data. A docker step
      # rather than `services:`, which would apply to every system in the matrix.
      # A one-member replica set, since change streams (the Watch view) need one.
      - name: MongoDB for the live tests
        if: matrix.os == 'ubuntu-22.04'
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0
          # Waits for the node to be primary, not just for the initiate to be accepted.
          until docker exec mongo mongosh --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] }) }; quit(db.hello().isWritablePrimary ? 0 : 1)'; do sleep 1; done
      # The shell tests run user scripts in Bun and skip themselves without it.
      - uses: oven-sh/setup-bun@v2
        if: matrix.os == 'ubuntu-22.04'
      # The SQL engines the live tests cover, oldest and newest PostgreSQL included, so the read-only guards and
      # writes run against real servers on every CI run instead of only on a developer's machine.
      - name: SQL servers for the live tests
        if: matrix.os == 'ubuntu-22.04'
        run: |
          docker run -d --name mysql -p 3306:3306 -e MYSQL_ROOT_PASSWORD=quarry mysql:8.4
          docker run -d --name mariadb -p 3307:3306 -e MARIADB_ROOT_PASSWORD=quarry mariadb:11.4
          docker run -d --name pg18 -p 5432:5432 -e POSTGRES_PASSWORD=quarry postgres:18
          docker run -d --name pg13 -p 5433:5432 -e POSTGRES_PASSWORD=quarry postgres:13
          until docker exec mysql mysqladmin -uroot -pquarry ping --silent; do sleep 1; done
          until docker exec mariadb mariadb-admin -uroot -pquarry ping --silent; do sleep 1; done
          until docker exec pg18 pg_isready -U postgres -q && docker exec pg13 pg_isready -U postgres -q; do sleep 1; done
      # PgBouncer in transaction mode with no prepared statement support, the worst case for the PostgreSQL pooler
      # fallback. It refuses the startup options and hands every transaction to any backend, so named statements and
      # session settings that work on a direct connection fail or leak here. It reaches its own postgres by name on a
      # docker network, and keeps 8 backends per database, which the tests count on.
      - name: PgBouncer for the live tests
        if: matrix.os == 'ubuntu-22.04'
        run: |
          docker network create pgb
          docker run -d --name pgb-pg --network pgb -e POSTGRES_PASSWORD=quarry postgres:18
          until docker exec pgb-pg pg_isready -U postgres -q; do sleep 1; done
          docker run -d --name pgbouncer --network pgb -p 6432:5432 -e DB_HOST=pgb-pg -e DB_USER=postgres -e DB_PASSWORD=quarry -e AUTH_TYPE=scram-sha-256 -e POOL_MODE=transaction -e MAX_PREPARED_STATEMENTS=0 -e IGNORE_STARTUP_PARAMETERS=extra_float_digits -e DEFAULT_POOL_SIZE=8 -e MAX_CLIENT_CONN=200 edoburu/pgbouncer
          until docker run --rm --network pgb -e PGPASSWORD=quarry postgres:18 psql -h pgbouncer -U postgres -At -c 'select 1' >/dev/null 2>&1; do sleep 1; done
      - if: matrix.os == 'ubuntu-22.04'
        run: cargo test --locked
        env:
          QUARRY_TEST_MONGO: mongodb://localhost:27017/?directConnection=true
          QUARRY_TEST_MONGO_RS: mongodb://localhost:27017/?directConnection=true
          QUARRY_TEST_MYSQL: mysql://root:quarry@127.0.0.1:3306
          QUARRY_TEST_MARIADB: mariadb://root:quarry@127.0.0.1:3307
          QUARRY_TEST_POSTGRES: postgres://postgres:quarry@127.0.0.1:5432/postgres
          QUARRY_TEST_POSTGRES13: postgres://postgres:quarry@127.0.0.1:5433/postgres
          QUARRY_TEST_PGBOUNCER: postgres://postgres:quarry@127.0.0.1:6432/postgres
      - if: matrix.os != 'ubuntu-22.04'
        run: cargo check --locked --all-targets
