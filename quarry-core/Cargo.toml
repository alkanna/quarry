[package]
name = "quarry-core"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
# Never depends on egui, eframe, muda or rfd: the UI reads this crate's state and sends it actions.

[features]
# Test helpers the app crate's tests use too.
test-support = []

# Same versions and features as the app's manifest, so each builds once.
[dependencies]
mongodb = { version = "3", features = ["socks5-proxy"] }
fast-socks5 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "mysql", "mysql-rsa", "postgres"] }
sqlx-mysql = { version = "0.9", default-features = false, features = ["offline"] }
sqlx-postgres = { version = "0.9", default-features = false, features = ["offline"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "macros", "sync", "net", "time"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
json5 = "1"
keyring = "4"
trash = "5"
dirs = "7"
rust_xlsxwriter = { version = "0.104", default-features = false, features = ["constant_memory"] }
sha2 = "0.11"
hmac = "0.13"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
chacha20poly1305 = { version = "0.11.0", features = ["getrandom"] }
flate2 = "1"
sqlformat = "0.5.0"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
iana-time-zone = "0.1"
pkcs8 = { version = "0.11", features = ["encryption", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
stringprep = "0.1"
unicode-normalization = "0.1"
zeroize = "1"
md5 = "0.8"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_System_ProcessStatus", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Time", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi"] }

[dev-dependencies]
# Already in the build through rust_xlsxwriter; the xlsx tests read the file back.
zip = { version = "9", default-features = false, features = ["deflate"] }
