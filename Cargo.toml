[package]
name = "quarry"
version = "0.26.0"
edition = "2024"
description = "A fast, native MongoDB workbench"
license = "MIT"
repository = "https://github.com/alkanna/quarry"

[dependencies]
eframe = "0.37"
# Only for its bundled monochrome icon font, used for toolbar icons; eframe already depends on it.
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
mongodb = { version = "3", features = ["socks5-proxy"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "macros", "sync"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "1"
keyring = "4"
rfd = "0.17"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.11"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
chacha20poly1305 = { version = "0.11.0", features = ["getrandom"] }

# Already in the build through other crates; read the app's own memory and CPU time for the status bar.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
lto = "thin"

# Dependencies build optimized once and stay cached; our own crate recompiles quickly but still runs smoothly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[target.'cfg(target_os = "macos")'.dependencies]
# Already used by eframe; named here only to keep benchmark and test windows in the background.
winit = { version = "0.30", default-features = false }
muda = { version = "0.21", default-features = false }
arboard = { version = "3", default-features = false }
