[package]
name = "quarry"
version = "0.54.0"
edition = "2024"
description = "A fast, native MongoDB and MySQL workbench"
license = "MIT"
repository = "https://github.com/alkanna/quarry"

[dependencies]
eframe = { version = "0.37", features = ["persistence"] }
# Only for its bundled monochrome icon font, used for toolbar icons; eframe already depends on it.
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
mongodb = { version = "3", features = ["socks5-proxy"] }
# The SOCKS5 client for SQL connections; mongodb already builds it for its own proxy option.
fast-socks5 = "0.10"
# MySQL and MariaDB. Postgres and SQLite are one feature each when they come. Runtime queries only, no macros.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "mysql", "mysql-rsa", "postgres"] }
# Executor::describe sits behind the drivers' offline feature since sqlx 0.9; enabling it here avoids the macros crate.
sqlx-mysql = { version = "0.9", default-features = false, features = ["offline"] }
sqlx-postgres = { version = "0.9", default-features = false, features = ["offline"] }
# net and time also come in through other crates; named because the AI agents link uses sockets, pipes and timeouts.
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "macros", "sync", "net", "time"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
json5 = "1"
keyring = "4"
rfd = "0.18"
# Deleting a file of a linked folder moves it to the Trash; its bytes are kept for the Undo toast.
trash = "5"
dirs = "7"
# Excel export. constant_memory streams a sheet of any size through a temp file.
rust_xlsxwriter = { version = "0.102", default-features = false, features = ["constant_memory"] }
# Custom rail icons are imported from any of these and stored as PNG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
sha2 = "0.11"
# Already in the build through sqlx; signs agents.json, proves both ends of the AI agents link and keys the scrub hash.
hmac = "0.13"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
chacha20poly1305 = { version = "0.11.0", features = ["getrandom"] }
# Already in the build through russh; compresses SQL dumps saved as .gz.
flate2 = "1"
sqlformat = "0.5.0"
# Already in the build through chrono; names this computer's IANA time zone for the PostgreSQL Advanced tab.
iana-time-zone = "0.1"
# Already in the build through russh; decrypts an encrypted PostgreSQL client key in memory, which sqlx cannot read.
pkcs8 = { version = "0.11", features = ["encryption", "pem"] }
# Already in the build through sqlx and mongodb. PostgreSQL verify-ca, and verify-full through SSH, open TLS in Quarry:
# sqlx 0.8 checks the host name for verify-ca, and through SSH checks the tunnel's 127.0.0.1.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
# Already in the build through sqlx; SASLprep for the SCRAM verifier of a PostgreSQL role password.
stringprep = "0.1"
# Already in the build through stringprep; the NFKC step of PostgreSQL's SASLprep, which stringprep's own saslprep orders differently.
unicode-normalization = "0.1"
# Already in the build through other crates; wipes role passwords and their verifiers from memory once sent.
zeroize = "1"
# Already in the build through other crates; the MD5 password hash for a server whose password_encryption is md5.
md5 = "0.8"
# Already in the build through other crates; scrub rules for AI agents, linear time with size limits.
regex = "1"

# Already in the build through other crates; read the app's own memory and CPU time for the status bar.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_System_ProcessStatus", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Time", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi"] }
# The window handle eframe hands over, for the title bar in win_frame.rs.
raw-window-handle = "0.6"

[dev-dependencies]
# Already in the build through rust_xlsxwriter; the xlsx tests read the file back.
zip = { version = "9", default-features = false, features = ["deflate"] }
# Drives the real App without a window in the tests under src/app/ui_tests.
egui_kittest = { version = "0.37", features = ["eframe"] }

[profile.release]
lto = "thin"

# Dependencies build optimized once and stay cached; our own crate recompiles quickly but still runs smoothly.
[profile.dev]
opt-level = 1
# Line numbers in backtraces without full debug info: on macOS debug info stays in the object
# files under target/debug, and full info let them grow to tens of gigabytes.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# Test builds of our crate skip optimization: a fresh test build took 131 s at opt-level 1 and 45 s at 0, and the tests
# ran no slower. cargo run keeps the dev profile.
[profile.test]
opt-level = 0

[target.'cfg(target_os = "macos")'.dependencies]
# Already used by eframe; named here only to keep benchmark and test windows in the background.
winit = { version = "0.30", default-features = false }
muda = { version = "0.21", default-features = false }
arboard = { version = "3", default-features = false }
