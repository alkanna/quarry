<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262c32"/>
      <stop offset="1" stop-color="#0c0e10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#86c9f9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#86c9f9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- macOS icon grid: 824 px tile with 100 px margin -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <ellipse cx="512" cy="560" rx="300" ry="260" fill="url(#glow)"/>
  <!-- the cut stone -->
  <g stroke="#0b1620" stroke-opacity="0.55" stroke-width="4" stroke-linejoin="round">
    <polygon points="292,420 412,300 452,420" fill="#4aa3e0"/>
    <polygon points="412,300 512,420 452,420" fill="#86c9f9"/>
    <polygon points="412,300 612,300 512,420" fill="#c4e8fd"/>
    <polygon points="612,300 572,420 512,420" fill="#86c9f9"/>
    <polygon points="612,300 732,420 572,420" fill="#3b8fd2"/>
    <polygon points="292,420 452,420 512,760" fill="#2a6fa8"/>
    <polygon points="452,420 512,420 512,760" fill="#4b9ad6"/>
    <polygon points="512,420 572,420 512,760" fill="#3684c4"/>
    <polygon points="572,420 732,420 512,760" fill="#1d5687"/>
  </g>
  <!-- teal girdle line: the app's id colour -->
  <line x1="300" y1="420" x2="724" y2="420" stroke="#00bac1" stroke-width="6" stroke-linecap="round" stroke-opacity="0.9"/>
  <!-- spark -->
  <path d="M708 250 L722 290 L762 304 L722 318 L708 358 L694 318 L654 304 L694 290 Z" fill="#f7d06e"/>
</svg>
